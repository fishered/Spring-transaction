spring.datasource.url=jdbc:h2:file:./data/cluster-tx-${sample.role};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sample-schema.sql,classpath:sample.sql
sample.role=coordinator
sample.participant-url=http://localhost:8081
cluster.tx.poll-delay-ms=200
cluster.tx.retry-delay-ms=200
cluster.tx.http.enabled=true
